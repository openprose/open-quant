name: Offline repository checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 scripts/check_repository.py
      - run: python3 -m unittest discover -s tests -v
      - run: node scripts/check_monitoring.mjs
      - run: node scripts/check_valuation.mjs
      - run: node scripts/check_backtesting.mjs
      - run: node scripts/check_sofr_change.mjs
      - run: node scripts/check_calibration.mjs
      - run: node scripts/check_vendor_inventory.mjs
      - run: node scripts/check_risk_report.mjs
      - run: node scripts/check_outcomes.mjs
      - run: node scripts/check_implementation.mjs
      - run: node scripts/check_simulation.mjs
      - run: node scripts/check_documentation.mjs
